# Génération du serveur Go du gateway (ogen) depuis openapi.yaml.
# Périmètre : routes VALIDÉES uniquement (gateway + identity). Étendre la liste au fil des phases.
generator:
  filters:
    path_regex: '^/(faq|files/[^/]+|hero-cards|home-partners|pages/\{slug\}|shipping/zones|blog/(articles(/\{slug\})?|categories|tags)|products/\{id\}/reviews|reviews|contact|newsletter/subscribe|quote-requests|promo-codes/validate|site-settings|commerce-settings|home-settings|admin/((uploads|faq|quote-responses|hero-cards|home-partners|pages|authors|blog-categories|blog-tags|articles|shipping-zones|promo-codes|reviews|contact-messages|newsletter-subscribers|quote-requests)(/.*)?|site-settings|commerce-settings|home-settings)|brands(/.*)?|categories(/.*)?|search/web(/images)?|sectors|products(/\{idOrSku\}|/\{id\}/related)?|auth/.*|consents|me(/(quote-requests|quote-draft|company|consents|data-export|data-requests|password|preferences|email(/confirm)?|sessions(/(revoke-others|\{id\}))?|login-activity|images/\{kind\}))?|healthz|readyz|admin/(auth/.*|me(/(password|preferences))?|staff-users(/.*)?|roles(/.*)?|permissions|audit-log|identity-settings|customers(/.*)?|companies(/(\{id\}(/(approve|reject))?)?)?|data-requests(/.*)?|sources(/.*)?|source-costs(/export)?|search-queries(/.*)?|search-zero-results(/.*)?|search-cache-settings|search-cache/purge|search-index/(status|reindex)|service-health|categories(/.*)?|attribute-defs(/.*)?|brands(/.*)?|sectors(/.*)?|products(/(\{id\}(/(submit-review|publish|archive|restore|versions))?)?)?|finance/.*))$'
  features:
    enable:
      - paths/client
