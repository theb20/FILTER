# Génération du serveur Go du gateway (ogen) depuis openapi.yaml.
# Périmètre : routes VALIDÉES uniquement (gateway + identity). Étendre la liste au fil des phases.
generator:
  filters:
    path_regex: '^/(faq|pages/\{slug\}|shipping/zones|blog/(articles(/\{slug\})?|categories|tags)|products/\{id\}/reviews|reviews|contact|newsletter/subscribe|quote-requests|promo-codes/validate|site-settings|commerce-settings|admin/((faq|pages|authors|blog-categories|blog-tags|articles|shipping-zones|promo-codes|reviews|contact-messages|newsletter-subscribers|quote-requests)(/.*)?|site-settings|commerce-settings)|brands(/.*)?|categories(/.*)?|sectors|products(/\{idOrSku\}|/\{id\}/related)?|auth/.*|consents|me(/(company|consents|data-export|data-requests|password|email(/confirm)?))?|healthz|readyz|admin/(auth/.*|me(/password)?|staff-users(/.*)?|roles(/.*)?|permissions|audit-log|identity-settings|customers(/.*)?|companies(/(\{id\}(/(approve|reject))?)?)?|data-requests(/.*)?|sources(/.*)?|source-costs(/export)?|search-queries(/.*)?|search-zero-results(/.*)?|search-cache-settings|search-cache/purge|search-index/(status|reindex)|service-health|categories(/.*)?|attribute-defs(/.*)?|brands(/.*)?|sectors(/.*)?|products(/(\{id\}(/(submit-review|publish|archive|restore|versions))?)?)?|finance/.*))$'
  features:
    enable:
      - paths/client
