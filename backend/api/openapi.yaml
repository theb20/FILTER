# Contrat HTTP du gateway — BROUILLON soumis à validation (phase 2, livrable 1).
openapi: 3.1.0
info:
  title: Industrial Commerce Platform API
  version: 1.0.0-draft
  summary: Contrat HTTP du gateway (client et backoffice).
  description: 'Plateforme e-commerce B2B/B2C de produits industriels (catalogue générique, aucune notion en dur d''une famille de produits).


    **Conventions**

    - Base `/v1`. Auth clients : JWT court + refresh à rotation. `/v1/admin/**` : personnel uniquement (autre émetteur, autre audience, 2FA TOTP).

    - Montants : objet `Money` en UNITÉS MINEURES + code ISO 4217. Jamais de décimal.

    - Langue : `Accept-Language` ; devise : `?currency=`.

    - Pagination par pages : `page` (≥ 1) et `pageSize` (≤ 100) ; réponses `{ items, page: { page, pageSize, total, totalPages } }`. Les listes
    qui grossissent sans fin (journal d''audit, mouvements de stock, notifications du prestataire, journal des messages) utilisent un CURSEUR
    : `cursor` + `limit` (≤ 200), réponse `{ items, nextCursor }`.

    - Statuts : une commande porte DEUX statuts indépendants, `status` (logistique) et `paymentStatus` (argent), plus l''indicateur `refundPending`.

    - Statut de validation : chaque tag porte `x-status: draft | validated`. Seuls sont validés les conventions communes, le schéma `common`,
    les événements, le gateway et le service identity.

    - Erreurs : RFC 9457 (`application/problem+json`) avec un `code` applicatif stable.

    - Idempotence : en-tête `Idempotency-Key` OBLIGATOIRE sur création de commande, de paiement, de remboursement et conversion de devis.

    - Concurrence optimiste : `ETag` / `If-Match` sur les mises à jour d''administration.

    - Anti-spam : `captchaToken` optionnel sur les formulaires publics (interface indépendante du fournisseur).

    - Permissions : chaque opération d''administration indique `x-required-permission`.'
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: /v1
  description: Gateway
tags:
- name: Search
  description: Recherche multi-critères et facettes.
  x-status: draft
- name: Catalogue
  description: Produits, catégories (arbre), marques, secteurs, machines.
  x-status: draft
- name: Pricing
  description: Devises et taux.
  x-status: draft
- name: Livraison
  description: Zones et estimation.
  x-status: draft
- name: Panier
  description: Panier serveur (invité ou connecté).
  x-status: draft
- name: Commandes
  description: Commandes du client.
  x-status: draft
- name: Paiement
  description: Moyens et intentions de paiement (prestataire abstrait).
  x-status: draft
- name: Devis
  description: Demandes de devis et devis.
  x-status: draft
- name: Compte
  description: 'Authentification, profil, consentements, RGPD. Service : identity.'
  x-status: validated
- name: Contenu
  description: Blog, avis, pages, FAQ, réglages.
  x-status: draft
- name: Newsletter
  description: Double opt-in.
  x-status: draft
- name: Support
  description: Contact, pièces jointes, chat, tickets.
  x-status: draft
- name: Technique
  description: Sondes.
  x-status: validated
- name: Admin · Authentification
  description: 'Connexion du personnel (pool séparé, 2FA TOTP). Service : identity.'
  x-status: validated
- name: Admin · Catalogue
  x-status: draft
- name: Admin · Stock et livraison
  x-status: draft
- name: Admin · Prix et promotions
  x-status: draft
- name: Admin · Ventes
  x-status: draft
- name: Admin · Clients (identité)
  description: 'Clients, entreprises (validation manuelle), demandes RGPD. Service : identity.'
  x-status: validated
- name: Admin · Support
  description: 'Messages de contact, tickets, chat. Service : support.'
  x-status: draft
- name: Admin · Contenu
  x-status: draft
- name: Admin · Administration
  description: 'Utilisateurs internes, rôles, permissions, journal d''audit, réglages du service identity. Service : identity.'
  x-status: validated
- name: Admin · Tableau de bord
  x-status: draft
- name: Admin · Moteur de recherche
  description: 'Sources externes, journal des recherches, recherches sans résultat, cache et indexation, coûts et quotas, santé. Services : sourcing, search.'
  x-status: validated
paths:
  /auth/email/resend:
    post:
      operationId: resendEmailVerification
      tags:
      - Compte
      summary: Renvoyer l'e-mail de vérification
      security:
      - customerAuth: []
      responses:
        '202':
          description: Succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Accepted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/email/verify:
    post:
      operationId: verifyEmail
      tags:
      - Compte
      summary: Confirmer mon adresse e-mail
      description: 'Lien reçu par e-mail. Tant que l''e-mail n''est pas vérifié : navigation, panier et commande restent possibles ; BLOQUÉS :
        dépôt d''avis, validation d''un compte entreprise, paiement différé (`EMAIL_NOT_VERIFIED`).'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
      responses:
        '204':
          description: Succès
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/login:
    post:
      operationId: login
      tags:
      - Compte
      summary: Se connecter
      description: 'Pose le cookie de rafraîchissement. Échecs : `INVALID_CREDENTIALS` (401). RALENTISSEMENT PROGRESSIF par couple (compte, IP)
        : 429 avec `Retry-After` ; jamais de verrouillage du compte. Un e-mail d''alerte est envoyé au titulaire après plusieurs échecs (réglable).
        Connexion permise avec e-mail non vérifié.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
          headers:
            Set-Cookie:
              description: 'Cookie de rafraîchissement : `ff_refresh=<jeton>; HttpOnly; Secure; SameSite=Strict; Path=/v1/auth; Max-Age=<réglage>`.
                Jamais dans le corps, jamais lisible par JavaScript. Le jeton d''accès (courte durée) reste en mémoire côté site.'
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/logout:
    post:
      operationId: logout
      tags:
      - Compte
      summary: Se déconnecter (cette session)
      description: 'Révoque la famille de jetons du cookie et efface le cookie. Idempotent : cookie absent, inconnu ou déjà révoqué → 204.'
      parameters:
      - $ref: '#/components/parameters/CsrfHeader'
      security:
      - refreshCookie: []
      - {}
      responses:
        '204':
          description: Succès
          headers:
            Set-Cookie:
              description: 'Efface le cookie : `ff_refresh=; Max-Age=0; Path=/v1/auth; HttpOnly; Secure; SameSite=Strict`.'
              schema:
                type: string
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/logout-all:
    post:
      operationId: logoutAll
      tags:
      - Compte
      summary: Déconnecter tous mes appareils
      description: Révoque toutes les familles de jetons du compte. Exécuté AUTOMATIQUEMENT après un changement ou une réinitialisation de mot
        de passe.
      security:
      - customerAuth: []
      responses:
        '204':
          description: Succès
          headers:
            Set-Cookie:
              description: 'Efface le cookie : `ff_refresh=; Max-Age=0; Path=/v1/auth; HttpOnly; Secure; SameSite=Strict`.'
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/oauth/exchange:
    post:
      operationId: exchangeOAuthCode
      tags:
      - Compte
      summary: Échanger le code contre une session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthExchangeRequest'
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
          headers:
            Set-Cookie:
              description: 'Cookie de rafraîchissement : `ff_refresh=<jeton>; HttpOnly; Secure; SameSite=Strict; Path=/v1/auth; Max-Age=<réglage>`.
                Jamais dans le corps, jamais lisible par JavaScript. Le jeton d''accès (courte durée) reste en mémoire côté site.'
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/oauth/{provider}/callback:
    get:
      operationId: oauthCallback
      tags:
      - Compte
      summary: Retour du fournisseur
      description: Vérifie `state` ET le cookie `ff_oauth` ; échange le code avec le `code_verifier` PKCE ; valide le jeton d'identité (signature,
        `iss`, `aud`, `exp`, **`nonce`**, `email_verified`). Liaison à un compte existant UNIQUEMENT si l'adresse locale est déjà vérifiée ; sinon
        refus générique (`?error=oauth_failed`). Les erreurs ne sont jamais renvoyées en JSON.
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          enum:
          - google
        description: Fournisseur OAuth. Google seul au lancement ; l'abstraction permet d'en ajouter.
      - name: code
        in: query
        required: false
        schema:
          type: string
      - name: state
        in: query
        required: true
        schema:
          type: string
      - name: error
        in: query
        required: false
        schema:
          type: string
      security: []
      responses:
        '302':
          description: Redirection vers le frontend avec `?code=` (échange à usage unique, 60 s) ou `?error=`.
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/oauth/{provider}/start:
    get:
      operationId: startOAuth
      tags:
      - Compte
      summary: Démarrer la connexion via un fournisseur
      description: 'Flux « code d''autorisation » durci : `state` aléatoire, **PKCE S256** (`code_challenge`) et **`nonce`** sont OBLIGATOIRES
        et générés côté serveur (jamais fournis par le navigateur). Le serveur mémorise (`state`, `code_verifier`, `nonce`, `redirectUri`) 10
        min et pose un cookie de liaison `ff_oauth` (HttpOnly, Secure, SameSite=Lax, Path=/v1/auth/oauth) contre la fabrication de connexion.
        `redirectUri` doit appartenir à la LISTE BLANCHE configurée (sinon 422).'
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          enum:
          - google
        description: Fournisseur OAuth. Google seul au lancement ; l'abstraction permet d'en ajouter.
      - name: redirectUri
        in: query
        required: true
        schema:
          type: string
          format: uri
      security: []
      responses:
        '302':
          description: Redirection vers le fournisseur.
          headers:
            Set-Cookie:
              description: '`ff_oauth=<liaison>; HttpOnly; Secure; SameSite=Lax; Path=/v1/auth/oauth; Max-Age=600`.'
              schema:
                type: string
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/password/forgot:
    post:
      operationId: forgotPassword
      tags:
      - Compte
      summary: 'Mot de passe oublié : envoyer le code'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '202':
          description: Toujours 202 (ne révèle pas si le compte existe).
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      description: Répond TOUJOURS 202 (ne révèle pas si le compte existe). Envoie un code à usage unique ; limites strictes par IP et par e-mail.
  /auth/password/reset:
    post:
      operationId: resetPassword
      tags:
      - Compte
      summary: Définir un nouveau mot de passe
      description: Refus des mots de passe compromis (`PASSWORD_COMPROMISED`). Déconnecte TOUS les appareils.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '204':
          description: Succès
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/password/verify-code:
    post:
      operationId: verifyPasswordCode
      tags:
      - Compte
      summary: Vérifier le code reçu
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyCodeRequest'
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyCodeResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/refresh:
    post:
      operationId: refreshTokens
      tags:
      - Compte
      summary: Renouveler le jeton d'accès (cookie de rafraîchissement)
      description: 'Lit le cookie `ff_refresh` (jamais le corps). ROTATION : le cookie est remplacé ; un jeton déjà utilisé révoque toute la famille.
        Protégé contre le CSRF (voir `X-Requested-With`, `Origin`). Appelée au chargement de la page pour obtenir un jeton d''accès.'
      parameters:
      - $ref: '#/components/parameters/CsrfHeader'
      security:
      - refreshCookie: []
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
          headers:
            Set-Cookie:
              description: 'Cookie de rafraîchissement : `ff_refresh=<jeton>; HttpOnly; Secure; SameSite=Strict; Path=/v1/auth; Max-Age=<réglage>`.
                Jamais dans le corps, jamais lisible par JavaScript. Le jeton d''accès (courte durée) reste en mémoire côté site.'
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/register:
    post:
      operationId: register
      tags:
      - Compte
      summary: Créer un compte
      description: 'Réponse TOUJOURS 202 et identique, que l''adresse existe déjà ou non (aucune fuite d''information, pas de 409). Nouvelle adresse
        : compte créé (e-mail non vérifié), e-mail de vérification envoyé. Adresse existante : aucun compte créé, e-mail « un compte existe déjà
        » envoyé au titulaire. Le travail effectué (hachage du mot de passe) est le même dans les deux cas. AUCUN jeton n''est renvoyé : l''utilisateur
        se connecte ensuite via `POST /auth/login`. Erreurs possibles seulement sur la FORME (422) : mot de passe trop court, `PASSWORD_COMPROMISED`,
        `CAPTCHA_FAILED`.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '202':
          description: Succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Accepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /blog/articles:
    get:
      operationId: listArticles
      tags:
      - Contenu
      summary: Articles du blog
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - name: category
        in: query
        required: false
        schema:
          type: string
      - name: kind
        in: query
        required: false
        schema:
          type: string
          enum:
          - advice
          - comparison
          - news
      - name: tag
        in: query
        required: false
        schema:
          type: string
      - $ref: '#/components/parameters/Query'
      security: []
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticlePage'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /blog/articles/{slug}:
    get:
      operationId: getArticle
      tags:
      - Contenu
      summary: Article
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/AcceptLanguage'
      - $ref: '#/components/parameters/Currency'
      security: []
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /blog/categories:
    get:
      operationId: listBlogCategories
      tags:
      - Contenu
      summary: Catégories du blog
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      security: []
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BlogCategory'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /blog/home:
    get:
      operationId: getBlogHome
      tags:
      - Contenu
      summary: Accueil du blog (sélections éditoriales)
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      - $ref: '#/components/parameters/Currency'
      security: []
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlogHome'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /blog/tags:
    get:
      operationId: listBlogTags
      tags:
      - Contenu
      summary: Étiquettes du blog
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      security: []
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BlogTag'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /brands:
    get:
      operationId: listBrands
      tags:
      - Catalogue
      summary: Marques
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      security: []
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandPage'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /brands/{slug}:
    get:
      operationId: getBrand
      tags:
      - Catalogue
      summary: Détail d'une marque
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/AcceptLanguage'
      security: []
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Brand'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /cart:
    get:
      operationId: getCart
      tags:
      - Panier
      summary: Panier courant (invité ou connecté)
      description: Crée un panier invité si besoin (cookie `guest_token` HttpOnly). Les totaux sont calculés par le serveur.
      parameters:
      - $ref: '#/components/parameters/Currency'
      security:
      - customerAuth: []
      - guestCart: []
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '400':
          $ref: '#/components/responses/BadRequest'
  /cart/items:
    post:
      operationId: addCartItem
      tags:
      - Panier
      summary: Ajouter un article
      parameters:
      - $ref: '#/components/parameters/Currency'
      security:
      - customerAuth: []
      - guestCart: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartAddItem'
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /cart/items/{productId}:
    patch:
      operationId: setCartItemQuantity
      tags:
      - Panier
      summary: Modifier la quantité
      parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/Currency'
      security:
      - customerAuth: []
      - guestCart: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartSetQuantity'
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
    delete:
      operationId: removeCartItem
      tags:
      - Panier
      summary: Retirer un article
      parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/Currency'
      security:
      - customerAuth: []
      - guestCart: []
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
