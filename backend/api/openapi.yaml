        in: query
        required: false
        schema:
          type: boolean
        description: Uniquement les produits disponibles en stock.
      - name: priceMin
        in: query
        required: false
        schema:
          type: string
          pattern: ^[0-9]+$
        description: Unités mineures de la devise demandée.
      - name: priceMax
        in: query
        required: false
        schema:
          type: string
          pattern: ^[0-9]+$
      - name: attr
        in: query
        required: false
        style: deepObject
        explode: true
        schema:
          type: object
          additionalProperties:
            oneOf:
            - type: string
            - type: array
              items:
                type: string
        description: Filtres par attribut, ex. `attr[micron_um]=10&attr[thread]=M22x1.5`. Seuls les attributs `filterable` de la catégorie sont
          acceptés.
