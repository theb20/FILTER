          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
      x-required-permission: engine:write
  /admin/search-index/status:
    get:
      operationId: adminSearchIndexStatus
      tags:
      - Admin · Moteur de recherche
      summary: État de l'index
      security:
      - staffAuth: []
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-required-permission: engine:read
  /admin/search-index/reindex:
    post:
      operationId: adminSearchIndexReindex
      tags:
      - Admin · Moteur de recherche
      summary: Relancer l'indexation
      description: Tâche asynchrone suivie dans `/admin/jobs`. Refusée (409) si une indexation est déjà en cours.
      security:
      - staffAuth: []
      responses:
        '202':
          description: Succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobRef'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
      x-required-permission: engine:write
  /admin/service-health:
    get:
      operationId: adminServiceHealth
      tags:
      - Admin · Moteur de recherche
      summary: Santé des services
      security:
      - staffAuth: []
