      - enabled
      - suspended
      - priority
      - timeoutMs
      - maxRetries
      - secretRef
      - costPerCallMicros
      - currency
      - allowsRawStorage
      - termsCheckedAt
      - maxCacheTtlSeconds
      - createdAt
      additionalProperties: false
