      description: Recherche par nom, modèle, SKU, référence ou référence croisée, tolérante aux fautes. Si `categoryId` est fourni, les facettes
        sont dérivées des attributs filtrables de cette catégorie.
      parameters:
      - $ref: '#/components/parameters/Query'
      - $ref: '#/components/parameters/AcceptLanguage'
      - $ref: '#/components/parameters/Currency'
      - $ref: '#/components/parameters/Page'
