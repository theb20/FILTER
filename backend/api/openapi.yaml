        '200':
          description: Succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceHealthReport'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-required-permission: engine:read
components:
  securitySchemes:
    customerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Jeton d'un client (audience `customer`).
    staffAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Jeton du personnel (audience `staff`, 2FA validé).
    guestCart:
      type: apiKey
      in: cookie
      name: guest_token
      description: Cookie HttpOnly posé par le serveur pour le panier invité.
    refreshCookie:
      type: apiKey
      in: cookie
      name: ff_refresh
      description: 'Jeton de rafraîchissement des clients : cookie HttpOnly, Secure, SameSite=Strict, Path=/v1/auth. Jamais dans un corps, jamais
        lisible par JavaScript.'
    staffChallenge:
      type: http
      scheme: bearer
      description: Jeton temporaire à usage unique du 2FA du personnel (voir `/admin/auth/2fa/*`). Audience `staff-challenge`.
  parameters:
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
      description: Numéro de page (≥ 1).
    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: Taille de page (max 100).
    Sort:
      name: sort
      in: query
      required: false
      schema:
        type: string
      description: 'Champ de tri, préfixé de `-` pour décroissant (ex. `-createdAt`). Champs autorisés : voir chaque ressource.'
    Query:
      name: q
      in: query
      required: false
      schema:
        type: string
        maxLength: 200
      description: Recherche texte.
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      schema:
        type: string
      description: 'Langue souhaitée (fr, en, es…). Repli sur la langue par défaut (`translationFallback: true`).'
    Currency:
      name: currency
      in: query
      required: false
      schema:
        type: string
        pattern: ^[A-Z]{3}$
      description: Devise d'affichage (sinon préférence du profil, sinon XOF).
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
      description: 'Clé d''idempotence : le même appel rejoué renvoie le même résultat.'
    IfMatch:
      name: If-Match
      in: header
      required: false
      schema:
        type: string
      description: ETag de la ressource (concurrence optimiste).
    From:
      name: from
      in: query
      required: false
      schema:
        type: string
        format: date
      description: Début de période (UTC).
    To:
      name: to
      in: query
      required: false
      schema:
        type: string
        format: date
      description: Fin de période (UTC).
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
      description: Curseur opaque renvoyé par la page précédente (`nextCursor`).
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
      description: Nombre d'éléments (max 200).
    CsrfHeader:
      name: X-Requested-With
      in: header
      required: true
      schema:
        type: string
        enum:
        - ff-web
      description: 'PROTECTION CSRF des routes qui lisent le cookie de rafraîchissement. Un en-tête personnalisé impose un contrôle CORS préalable
        : un site tiers ne peut pas l''envoyer. Le gateway exige AUSSI un en-tête `Origin` présent et dans la liste blanche (et `Sec-Fetch-Site`
        ∈ same-origin/same-site quand il existe). Sinon : 403 `CSRF_FAILED`.'
  responses:
    BadRequest:
      description: Requête invalide.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Authentification requise ou expirée.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Droits insuffisants.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Ressource introuvable.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Conflit (doublon ou état incompatible).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionFailed:
      description: '`If-Match` ne correspond plus.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unprocessable:
      description: Règle métier non respectée (voir `code` et `errors[]`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Trop de requêtes.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    SourceInput:
      type: object
      properties:
        kind:
          type: string
          enum:
          - web_search_api
          - manufacturer_api
          - distributor_feed
        name:
          type: string
          minLength: 1
          maxLength: 120
        baseUrl:
          type: string
          format: uri
        priority:
          type: integer
          format: int32
          minimum: 0
          description: Plus la valeur est basse, plus la source est interrogée tôt ; même valeur = en parallèle.
        timeoutMs:
          type: integer
          format: int32
          minimum: 1
          description: Délai maximal d'un appel (proposition 3000).
        maxRetries:
          type: integer
          format: int32
          minimum: 0
          description: Tentatives sur erreurs réseau et 5xx uniquement (proposition 2).
        secretRef:
          type: string
          minLength: 1
          description: Nom du secret (variable d'environnement ou coffre). Jamais la clé elle-même.
        costPerCallMicros:
          type: integer
          format: int64
          minimum: 0
          description: 'Micro-unités de la devise de la source (1 unité = 1 000 000). Pour une source : estimation du coût MAXIMAL d''un appel, servant à la réservation.'
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          description: Code ISO 4217 de facturation de la source.
          
        maxCacheTtlSeconds:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 1
          description: Durée maximale de cache selon les conditions d'usage ; null = aucune mise en cache de cette source.
      required:
      - kind
      - name
      - baseUrl
      - priority
      - timeoutMs
      - maxRetries
      - secretRef
      - costPerCallMicros
      - currency
      additionalProperties: false
      x-status: validated
    Source:
      type: object
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - web_search_api
          - manufacturer_api
          - distributor_feed
        name:
          type: string
        baseUrl:
          type: string
          format: uri
        enabled:
          type: boolean
        suspended:
          type: boolean
          description: Suspendue automatiquement (budget atteint) ; se réactive à la période suivante ou par relèvement du budget.
        priority:
          type: integer
          format: int32
        timeoutMs:
          type: integer
          format: int32
        maxRetries:
          type: integer
          format: int32
        secretRef:
          type: string
        costPerCallMicros:
          type: integer
          format: int64
        currency:
          type: string
        allowsRawStorage:
          type: boolean
        termsCheckedAt:
          type:
          - string
