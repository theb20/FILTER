        required: false
        schema:
          type: string
          format: uuid
        description: Catégorie (inclut ses descendantes).
      - name: brandId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: sectorId
        in: query
        required: false
        schema:
          type: string
          format: uuid
