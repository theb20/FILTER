// Contrat gRPC interne de l'administration du moteur, porté par le service `search` : journal des recherches, recherches
// sans résultat, cache, indexation. STATUS: validated (phase 1, voir docs/PROPOSITION-MOTEUR.md v3).
syntax = "proto3";

package searchadmin.v1;

import "common/v1/common.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/theb20/FILTER/backend/pkg/gen/searchadmin/v1;searchadminv1";

// `text` est le texte MASQUÉ (e-mails et numéros de téléphone remplacés) : le texte brut n'est jamais stocké.
message QuerySummary {
  string id = 1;
  string text = 2;
  string language = 3;
  string country = 4;
  google.protobuf.Timestamp at = 5;
  int32 duration_ms = 6;
  int32 result_count = 7;
  bool clicked = 8;
}

message QuerySourceLine {
  string source_id = 1;
  string source_name = 2;
  string status = 3;
  int32 raw_count = 4;
  int32 duration_ms = 5;
  bool from_cache = 6;
  bool raw_available = 7;
}

message ListQueriesRequest {
  common.v1.CursorRequest cursor = 1;
  string query = 2;
  string language = 3;
  string country = 4;
  optional google.protobuf.Timestamp from = 5;
  optional google.protobuf.Timestamp to = 6;
  optional bool has_results = 7;
  optional bool clicked = 8;
}

message ListQueriesResponse {
  repeated QuerySummary items = 1;
  common.v1.CursorResponse cursor = 2;
}

message ExportQueriesRequest {
  string query = 1;
  string language = 2;
  string country = 3;
  optional google.protobuf.Timestamp from = 4;
  optional google.protobuf.Timestamp to = 5;
  optional bool has_results = 6;
  optional bool clicked = 7;
}

message ExportQueriesResponse {
  bytes csv = 1;
}

message GetQueryRequest {
  string id = 1;
}

message QueryDetail {
  QuerySummary query = 1;
  repeated QuerySourceLine sources = 2;
  // Désignations du résultat fusionné (après fusion des doublons).
  repeated string merged = 3;
  optional string replay_of_id = 4;
}

message GetQueryResponse {
  QueryDetail detail = 1;
}

enum ReplayMode {
  REPLAY_MODE_UNSPECIFIED = 0;
  // Relit les résultats bruts conservés (gratuit ; seulement si leur stockage était autorisé et non expiré).
  REPLAY_MODE_REREAD = 1;
  // Refait les appels (coût réel) : crée une NOUVELLE ligne de journal.
  REPLAY_MODE_REDO = 2;
}

message ReplayQueryRequest {
  string id = 1;
  ReplayMode mode = 2;
}

message ReplayQueryResponse {
  QueryDetail detail = 1;
}

enum ZeroResultKind {
  ZERO_RESULT_KIND_UNSPECIFIED = 0;
  ZERO_RESULT_KIND_NO_RESULT = 1;
  ZERO_RESULT_KIND_NO_CLICK = 2;
}

message ZeroResult {
  string id = 1;
  ZeroResultKind kind = 2;
  string text = 3;
  string language = 4;
  string country = 5;
  int64 occurrences = 6;
  google.protobuf.Timestamp first_seen_at = 7;
  google.protobuf.Timestamp last_seen_at = 8;
  string status = 9;
  optional string handled_by = 10;
  optional google.protobuf.Timestamp handled_at = 11;
  int32 trend = 12;
}

message ListZeroResultsRequest {
  common.v1.PageRequest page = 1;
  ZeroResultKind kind = 2;
  string status = 3;
}

message ListZeroResultsResponse {
  repeated ZeroResult items = 1;
  common.v1.PageResponse page = 2;
}

message ExportZeroResultsRequest {
  ZeroResultKind kind = 1;
  string status = 2;
}

message ExportZeroResultsResponse {
  bytes csv = 1;
}

message HandleZeroResultRequest {
  string id = 1;
}

message HandleZeroResultResponse {
  ZeroResult item = 1;
}

message CacheSettings {
  int32 availability_seconds = 1;
  int32 price_seconds = 2;
  int32 search_results_seconds = 3;
  int32 characteristics_seconds = 4;
  // Nombre de résultats APRÈS fusion des doublons au-delà duquel les niveaux suivants ne sont plus interrogés.
  int32 min_results_to_stop = 5;
  int32 global_timeout_ms = 6;
}

message GetCacheSettingsRequest {}

message GetCacheSettingsResponse {
  CacheSettings settings = 1;
}

message PutCacheSettingsRequest {
  CacheSettings settings = 1;
}

message PutCacheSettingsResponse {
  CacheSettings settings = 1;
}

// data_type absent = purge totale ; sinon availability | price | search_results | characteristics. Auditée.
message PurgeCacheRequest {
  optional string data_type = 1;
}

message PurgeCacheResponse {
  int64 purged_entries = 1;
}

message GetIndexStatusRequest {}

message GetIndexStatusResponse {
  string state = 1;
  int64 documents = 2;
  int64 size_bytes = 3;
  int32 pending_tasks = 4;
  optional google.protobuf.Timestamp last_indexed_at = 5;
  double cache_hit_rate = 6;
  optional string last_error = 7;
}

message ReindexRequest {}

message ReindexResponse {
  common.v1.Job job = 1;
}

service SearchAdminService {
  rpc ListQueries(ListQueriesRequest) returns (ListQueriesResponse);
  rpc ExportQueries(ExportQueriesRequest) returns (ExportQueriesResponse);
  rpc GetQuery(GetQueryRequest) returns (GetQueryResponse);
  rpc ReplayQuery(ReplayQueryRequest) returns (ReplayQueryResponse);
  rpc ListZeroResults(ListZeroResultsRequest) returns (ListZeroResultsResponse);
  rpc ExportZeroResults(ExportZeroResultsRequest) returns (ExportZeroResultsResponse);
  rpc HandleZeroResult(HandleZeroResultRequest) returns (HandleZeroResultResponse);
  rpc GetCacheSettings(GetCacheSettingsRequest) returns (GetCacheSettingsResponse);
  rpc PutCacheSettings(PutCacheSettingsRequest) returns (PutCacheSettingsResponse);
  rpc PurgeCache(PurgeCacheRequest) returns (PurgeCacheResponse);
  rpc GetIndexStatus(GetIndexStatusRequest) returns (GetIndexStatusResponse);
  // Tâche asynchrone suivie dans /admin/jobs ; refusée si une indexation est déjà en cours.
  rpc Reindex(ReindexRequest) returns (ReindexResponse);
}
