// Ralentissement progressif par couple (compte, IP). AUCUN verrouillage de compte.
message LoginThrottle {
  int32 free_attempts = 1;
  int32 base_delay_seconds = 2;
  int32 max_delay_seconds = 3;
}

// Défauts : 15 min, 30 jours (clients), 8 h (personnel), code de réinitialisation 15 min / 5 essais. Durées de conservation : absent = pas de purge automatique.
message IdentitySettings {
  int32 access_token_minutes = 1;
  int32 customer_refresh_days = 2;
  int32 staff_refresh_hours = 3;
  int32 password_reset_code_minutes = 4;
  int32 password_reset_max_attempts = 5;
  int32 staff_challenge_minutes = 6;
  int32 invitation_hours = 7;
  int32 email_verification_hours = 8;
  int32 email_change_hours = 9;
  int32 recent_login_minutes = 10;
  LoginThrottle login_throttle = 11;
  int32 login_alert_after_failures = 12;
  optional int32 personal_data_days = 13;
  optional int32 audit_log_days = 14;
}

message GetSettingsRequest {}

message GetSettingsResponse {
  IdentitySettings settings = 1;
}

message PutSettingsRequest {
  IdentitySettings settings = 1;
}

message PutSettingsResponse {
  IdentitySettings settings = 1;
}

// Comptes clients et personnel, sessions, OAuth, RBAC, consentements, RGPD, journal d'audit.
service IdentityService {
  // Réponse UNIFORME (status = accepted) que l'adresse existe déjà ou non : aucune fuite. Nouvelle adresse : compte créé (e-mail non vérifié) + EmailVerificationRequested. Adresse existante : aucun compte, événement RegistrationAttemptOnExistingAccount. Même travail dans les deux cas (hachage). AUCUN jeton.
  rpc Register(RegisterRequest) returns (RegisterResponse);
  // Ralentissement PROGRESSIF par couple (compte, IP) via RESOURCE_EXHAUSTED + retry_after ; jamais de verrouillage. Publie SuspiciousLoginAlertRequested après N échecs. Le jeton de rafraîchissement est destiné au COOKIE du gateway : jamais dans un corps HTTP.
  rpc Login(LoginRequest) returns (LoginResponse);
  // Rotation : le jeton présenté est invalidé ; rejeu détecté → famille révoquée.
  rpc RefreshTokens(RefreshTokensRequest) returns (RefreshTokensResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  // Révoque toutes les familles de jetons. Aussi appelé après changement ou réinitialisation du mot de passe.
  rpc LogoutAll(LogoutAllRequest) returns (LogoutAllResponse);
  // state, PKCE (S256) et nonce OBLIGATOIRES, générés côté serveur. `binding` : valeur du cookie ff_oauth (anti fabrication de connexion). redirect_uri vérifié contre la liste blanche.
  rpc StartOAuth(StartOAuthRequest) returns (StartOAuthResponse);
  // Vérifie state + liaison, échange avec le code_verifier PKCE, valide le jeton d'identité (signature, iss, aud, exp, nonce, email_verified). Liaison à un compte existant seulement si son e-mail est vérifié.
  rpc CompleteOAuth(CompleteOAuthRequest) returns (CompleteOAuthResponse);
  rpc ExchangeOAuthCode(ExchangeOAuthCodeRequest) returns (ExchangeOAuthCodeResponse);
  // Réponse identique que le compte existe ou non.
  rpc ForgotPassword(ForgotPasswordRequest) returns (ForgotPasswordResponse);
  rpc VerifyPasswordCode(VerifyPasswordCodeRequest) returns (VerifyPasswordCodeResponse);
  rpc ResetPassword(ResetPasswordRequest) returns (ResetPasswordResponse);
  rpc VerifyEmail(VerifyEmailRequest) returns (VerifyEmailResponse);
  rpc ResendEmailVerification(ResendEmailVerificationRequest) returns (ResendEmailVerificationResponse);
  // Refuse les mots de passe compromis ; révoque toutes les AUTRES sessions (celle de `current_session_id`, claim `sid` du jeton d'accès, est conservée).
  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse);
  // Réponse uniforme ; mot de passe (ou connexion récente) exigé ; vérification de la NOUVELLE adresse avant bascule ; notification à l'ANCIENNE.
  rpc RequestEmailChange(RequestEmailChangeRequest) returns (RequestEmailChangeResponse);
  // Bascule l'adresse, notifie l'ancienne, révoque les autres sessions.
  rpc ConfirmEmailChange(ConfirmEmailChangeRequest) returns (ConfirmEmailChangeResponse);
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse);
  rpc GetCompany(GetCompanyRequest) returns (GetCompanyResponse);
  // Toute modification des données légales repasse le statut à PENDING.
  rpc PutCompany(PutCompanyRequest) returns (PutCompanyResponse);
  rpc RecordConsent(RecordConsentRequest) returns (RecordConsentResponse);
  rpc GetConsents(GetConsentsRequest) returns (GetConsentsResponse);
  rpc RequestDataExport(RequestDataExportRequest) returns (RequestDataExportResponse);
  // `password` obligatoire si le compte en possède un ; sinon `confirm_email` + connexion récente.
  rpc RequestErasure(RequestErasureRequest) returns (RequestErasureResponse);
  rpc ListMyDataRequests(ListMyDataRequestsRequest) returns (ListMyDataRequestsResponse);
  rpc ListDataRequests(ListDataRequestsRequest) returns (ListDataRequestsResponse);
  rpc ProcessDataRequest(ProcessDataRequestRequest) returns (ProcessDataRequestResponse);
  // Clés publiques pour la vérification locale des JWT par le gateway (audience : customer | staff).
  // Préférences d'interface du compte connecté (personnel ou client), synchronisées entre appareils.
  rpc GetPreferences(GetPreferencesRequest) returns (GetPreferencesResponse);
  // Appareils connectés : sessions ACTIVES du compte (famille de jetons non révoquée et non expirée), avec l'appareil et
  // la ville APPROXIMATIVE déduite de l'adresse IP (base locale ; aucune IP n'est envoyée à un tiers).
  rpc ListMySessions(ListMySessionsRequest) returns (ListMySessionsResponse);
  // Déconnecte UN appareil du compte (session d'un autre compte : NOT_FOUND).
  rpc RevokeMySession(RevokeMySessionRequest) returns (RevokeMySessionResponse);
  // Déconnecte tous les appareils sauf celui de `current_session_id`.
  rpc RevokeMyOtherSessions(RevokeMyOtherSessionsRequest) returns (RevokeMyOtherSessionsResponse);
  // Historique des connexions réussies (90 jours, purge automatique), du plus récent au plus ancien.
  rpc ListMyLoginEvents(ListMyLoginEventsRequest) returns (ListMyLoginEventsResponse);
  // Lien « ce n'était pas moi » de l'e-mail d'alerte : jeton à usage unique ; révoque TOUTES les sessions du compte.
  rpc SecureAccountFromAlert(SecureAccountFromAlertRequest) returns (SecureAccountFromAlertResponse);
  // Photo de profil (`avatar`) ou couverture (`cover`) : PNG, JPEG ou WebP vérifiés par leur contenu, 600 Kio au plus.
  rpc PutMyImage(PutMyImageRequest) returns (PutMyImageResponse);
  rpc GetMyImage(GetMyImageRequest) returns (GetMyImageResponse);
  rpc DeleteMyImage(DeleteMyImageRequest) returns (DeleteMyImageResponse);
  rpc PutPreferences(PutPreferencesRequest) returns (PutPreferencesResponse);
  rpc GetJwks(GetJwksRequest) returns (GetJwksResponse);
  // status : authenticated | two_factor_required | two_factor_enrollment_required.
  rpc StaffLogin(StaffLoginRequest) returns (StaffLoginResponse);
  // Jeton temporaire (portée verify) à usage unique, émis par StaffLogin.
  rpc StaffVerifyTwoFactor(StaffVerifyTwoFactorRequest) returns (StaffVerifyTwoFactorResponse);
  // Consomme le jeton (portée enroll) et en émet un nouveau (portée confirm). Jetons temporaires à USAGE UNIQUE, courte durée, 5 codes erronés maximum.
  rpc StaffEnrollTwoFactor(StaffEnrollTwoFactorRequest) returns (StaffEnrollTwoFactorResponse);
  rpc StaffConfirmTwoFactor(StaffConfirmTwoFactorRequest) returns (StaffConfirmTwoFactorResponse);
  rpc StaffRefresh(StaffRefreshRequest) returns (StaffRefreshResponse);
  // Enchaîne sur l'inscription du 2FA (status : two_factor_enrollment_required).
  rpc AcceptStaffInvitation(AcceptStaffInvitationRequest) returns (AcceptStaffInvitationResponse);
  rpc ChangeStaffPassword(ChangeStaffPasswordRequest) returns (ChangeStaffPasswordResponse);
  // Voie de réinitialisation du mot de passe du personnel ; notifie la personne ; audité.
  rpc ResendStaffInvitation(ResendStaffInvitationRequest) returns (ResendStaffInvitationResponse);
  rpc StaffLogout(StaffLogoutRequest) returns (StaffLogoutResponse);
  rpc GetStaffProfile(GetStaffProfileRequest) returns (GetStaffProfileResponse);
  rpc CheckPermission(CheckPermissionRequest) returns (CheckPermissionResponse);
  // Lister : StaffUsers.
  rpc ListStaffUsers(ListStaffUsersRequest) returns (ListStaffUsersResponse);
  // Lire : StaffUser.
  rpc GetStaffUser(GetStaffUserRequest) returns (GetStaffUserResponse);
  // Créer : StaffUser (`id` ignoré).
  rpc CreateStaffUser(CreateStaffUserRequest) returns (CreateStaffUserResponse);
  // Modifier : StaffUser (concurrence optimiste via `if_match`).
  rpc UpdateStaffUser(UpdateStaffUserRequest) returns (UpdateStaffUserResponse);
  // Interdits : dernier super-admin (LAST_SUPER_ADMIN), soi-même, retrait de son propre rôle d'administration (SELF_ACTION_FORBIDDEN). Révoque ses sessions ; audit conservé.
  rpc DeactivateStaffUser(DeactivateStaffUserRequest) returns (DeactivateStaffUserResponse);
  rpc ReactivateStaffUser(ReactivateStaffUserRequest) returns (ReactivateStaffUserResponse);
  rpc StaffLogoutAll(StaffLogoutAllRequest) returns (StaffLogoutAllResponse);
  // Notifie la personne concernée ; audité.
  rpc ResetStaffTwoFactor(ResetStaffTwoFactorRequest) returns (ResetStaffTwoFactorResponse);
  // Lister : Roles.
  rpc ListRoles(ListRolesRequest) returns (ListRolesResponse);
  // Lire : Role.
  rpc GetRole(GetRoleRequest) returns (GetRoleResponse);
  // Créer : Role (`id` ignoré).
  rpc CreateRole(CreateRoleRequest) returns (CreateRoleResponse);
  // Modifier : Role (concurrence optimiste via `if_match`).
  rpc UpdateRole(UpdateRoleRequest) returns (UpdateRoleResponse);
  // Supprimer : Role.
  rpc DeleteRole(DeleteRoleRequest) returns (DeleteRoleResponse);
  rpc ListPermissions(ListPermissionsRequest) returns (ListPermissionsResponse);
  rpc ListCustomers(ListCustomersRequest) returns (ListCustomersResponse);
  rpc GetCustomer(GetCustomerRequest) returns (GetCustomerResponse);
  rpc SetCustomerStatus(SetCustomerStatusRequest) returns (SetCustomerStatusResponse);
  rpc ListCompanies(ListCompaniesRequest) returns (ListCompaniesResponse);
  rpc GetCompanyById(GetCompanyByIdRequest) returns (GetCompanyByIdResponse);
  // Audité. Ouvre les conditions pro. Refusé (EMAIL_NOT_VERIFIED) tant que l'e-mail du titulaire n'est pas vérifié.
  rpc ApproveCompany(ApproveCompanyRequest) returns (ApproveCompanyResponse);
  rpc RejectCompany(RejectCompanyRequest) returns (RejectCompanyResponse);
  rpc CountPendingCompanies(CountPendingCompaniesRequest) returns (CountPendingCompaniesResponse);
  // Pagination PAR CURSEUR (le journal grossit sans fin).
  rpc ListAudit(ListAuditRequest) returns (ListAuditResponse);
  // Réglages possédés par identity (exposés via /admin/identity-settings).
  rpc GetSettings(GetSettingsRequest) returns (GetSettingsResponse);
  // Publie `settings.changed`.
  rpc PutSettings(PutSettingsRequest) returns (PutSettingsResponse);
}

// ── Sécurité du compte : appareils, historique, alertes ──────────────────────────────────────────────

// Position APPROXIMATIVE déduite de l'adresse IP (ville de l'opérateur, souvent) ; absente si inconnue.
message GeoLocation {
  string city = 1;
  string region = 2;
  string country_code = 3; // ISO 3166-1 alpha-2
  string country = 4;
  double latitude = 5;
  double longitude = 6;
}

// Appareil déduit de l'en-tête User-Agent (approximatif).
message DeviceInfo {
  string browser = 1;
  string os = 2;
  string kind = 3; // desktop | mobile | tablet | unknown
}

message MySession {
  string id = 1;
  bool current = 2;
  google.protobuf.Timestamp created_at = 3;
  google.protobuf.Timestamp last_seen_at = 4;
  string ip = 5;
  DeviceInfo device = 6;
  optional GeoLocation location = 7;
}

message ListMySessionsRequest {
  string user_id = 1;
  string current_session_id = 2;
}

message ListMySessionsResponse {
  repeated MySession sessions = 1;
}

message RevokeMySessionRequest {
  string user_id = 1;
  string session_id = 2;
}

message RevokeMySessionResponse {}

message RevokeMyOtherSessionsRequest {
  string user_id = 1;
  string current_session_id = 2;
}

message RevokeMyOtherSessionsResponse {
  int32 revoked = 1;
}

message LoginEvent {
  string id = 1;
  google.protobuf.Timestamp at = 2;
  string ip = 3;
  DeviceInfo device = 4;
  optional GeoLocation location = 5;
  string method = 6; // password | google
  bool new_device = 7;
}

message ListMyLoginEventsRequest {
  string user_id = 1;
  common.v1.PageRequest page = 2;
}

message ListMyLoginEventsResponse {
  repeated LoginEvent events = 1;
  common.v1.PageResponse page = 2;
}

message SecureAccountFromAlertRequest {
  string token = 1;
}

message SecureAccountFromAlertResponse {}

message PutMyImageRequest {
  string user_id = 1;
  string kind = 2; // avatar | cover
  bytes data = 3;
}

message PutMyImageResponse {
  google.protobuf.Timestamp updated_at = 1;
  string content_type = 2;
}

message GetMyImageRequest {
  string user_id = 1;
  string kind = 2;
}

message GetMyImageResponse {
  bytes data = 1;
  string content_type = 2;
  google.protobuf.Timestamp updated_at = 3;
}

message DeleteMyImageRequest {
  string user_id = 1;
  string kind = 2;
}

message DeleteMyImageResponse {}
