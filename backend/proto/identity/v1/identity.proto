// Contrat gRPC interne.
// STATUS: validated
syntax = "proto3";

package identity.v1;

import "common/v1/common.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/theb20/FILTER/backend/pkg/gen/identity/v1;identityv1";

enum UserKind {
  USER_KIND_UNSPECIFIED = 0;
  USER_KIND_INDIVIDUAL = 1;
  USER_KIND_COMPANY = 2;
}

enum CompanyStatus {
  COMPANY_STATUS_UNSPECIFIED = 0;
  COMPANY_STATUS_PENDING = 1;
  COMPANY_STATUS_APPROVED = 2;
  COMPANY_STATUS_REJECTED = 3;
}

// Désactivation, jamais de suppression : l'historique d'audit est conservé.
enum StaffStatus {
  STAFF_STATUS_UNSPECIFIED = 0;
  STAFF_STATUS_INVITED = 1;
  STAFF_STATUS_ACTIVE = 2;
  STAFF_STATUS_DEACTIVATED = 3;
}

// Qui possède les préférences : un compte du personnel ou un compte client (deux mondes séparés).
enum PrincipalKind {
  PRINCIPAL_KIND_UNSPECIFIED = 0;
  PRINCIPAL_KIND_STAFF = 1;
  PRINCIPAL_KIND_CUSTOMER = 2;
}

enum DataRequestKind {
  DATA_REQUEST_KIND_UNSPECIFIED = 0;
  DATA_REQUEST_KIND_EXPORT = 1;
  DATA_REQUEST_KIND_ERASURE = 2;
}

enum DataRequestStatus {
  DATA_REQUEST_STATUS_UNSPECIFIED = 0;
  DATA_REQUEST_STATUS_RECEIVED = 1;
  DATA_REQUEST_STATUS_PROCESSING = 2;
  DATA_REQUEST_STATUS_COMPLETED = 3;
  DATA_REQUEST_STATUS_REJECTED = 4;
}

message Company {
  string id = 1;
  string legal_name = 2;
  string tax_id = 3;
  string country = 4;
  CompanyStatus status = 5;
  bool tax_id_verified = 6;
  optional string rejection_reason = 7;
  optional google.protobuf.Timestamp decided_at = 8;
  optional string job_title = 9;
}

message User {
  string id = 1;
  string email = 2;
  bool email_verified = 3;
  UserKind kind = 4;
  optional string first_name = 5;
  optional string last_name = 6;
  optional string phone_e164 = 7;
  string locale = 8;
  string preferred_currency = 9;
  optional Company company = 10;
  bool pro_conditions_active = 11;
  string status = 12;
  google.protobuf.Timestamp created_at = 13;
  // Photo de profil et image de couverture : date de dernière modification (absente = aucune image).
  optional google.protobuf.Timestamp avatar_updated_at = 14;
  optional google.protobuf.Timestamp cover_updated_at = 15;
}

message TokenPair {
  string access_token = 1;
  string refresh_token = 2;
  int32 expires_in_seconds = 3;
}

message CompanyInput {
  string legal_name = 1;
  string tax_id = 2;
  string country = 3;
  optional string job_title = 4;
}

message RegisterRequest {
